# ============================================================
# 테스트 프로필. 외부 의존(MySQL, Redis, Firebase, OpenAI, S3) 없이 컨텍스트가 뜨게 한다.
# application.properties 의 ${...} 자리표시자를 더미 값으로 채우는 것이 목적이다.
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.main.allow-bean-definition-overriding=true

# Firebase 는 서비스 계정 파일 없이 초기화할 수 없으므로 끈다.
firebase.enabled=false

openai.secret-key=test
openai.prompts.content.id=test
openai.prompts.summary.id=test
openai.prompts.colors.id=test
openai.prompts.music.id=test
openai.prompts.sympathy.id=test

aws.s3.access-key=test
aws.s3.secret-access-key=test

# Lettuce 는 지연 연결이라 서버가 없어도 컨텍스트는 뜬다. RedisService 는 테스트에서 mock 으로 대체한다.
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.issuer=test-issuer
jwt.member.secret=test-member-secret-0123456789-0123456789
jwt.member.access-token-ttl=30m
jwt.member.refresh-token-ttl=60d
jwt.admin.secret=test-admin-secret-0123456789-0123456789-x
jwt.admin.access-token-ttl=2h

# 공급자 JWKS 디코더를 끄고 TestSocialConfig 의 테스트 키 디코더를 쓴다
oauth.jwks-enabled=false
oauth.google.client-ids=ios-client,android-server-client
oauth.apple.client-id=com.momeokji.cake
oauth.apple.team-id=TEAMID1234
oauth.apple.key-id=KEYID12345
oauth.apple.private-key-path=
# 32바이트 base64 더미 키
oauth.apple.token-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
oauth.apple.base-url=http://localhost:0

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
