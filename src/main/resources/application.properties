spring.application.name=aiDiarybackend

# 서비스 타임존. JVM 기본 타임존은 AiDiarybackendApplication 이 KST 로 고정한다.
spring.jackson.time-zone=Asia/Seoul

# 하루(KST) 작성 가능한 일기 개수. 초과하면 429 DIARY_DAILY_LIMIT_EXCEEDED.
diary.daily-limit=3

openai.secret-key=${OPENAI_SECRET_KEY}
openai.api-url=https://api.openai.com/v1/responses

# 프롬프트 본문(System 메시지)은 src/main/resources/prompts/<key>.md 에 있다. 키마다 파일이 있어야 기동한다.
# model 은 필수. temperature / max-output-tokens / reasoning-effort 는 비우면 요청에 넣지 않는다.
# gpt-4o-mini(2027-01-14 종료)와 gpt-5-mini(2026-12-11 종료)의 대체 모델인 gpt-6-luna 를 쓴다.
# reasoning-effort 가 none 이 아니면 temperature 를 둘 수 없다(기동 시 검사). 분류·요약·공감문은 none 으로 충분하고,
# 일기 생성(content)만 low 로 둔다.
openai.prompts.content.model=gpt-6-luna
openai.prompts.content.reasoning-effort=low
openai.prompts.content.max-output-tokens=4096

openai.prompts.summary.model=gpt-6-luna
openai.prompts.summary.reasoning-effort=none
openai.prompts.summary.max-output-tokens=1024

openai.prompts.colors.model=gpt-6-luna
openai.prompts.colors.reasoning-effort=none
openai.prompts.colors.temperature=0.8
openai.prompts.colors.max-output-tokens=2048

openai.prompts.music.model=gpt-6-luna
openai.prompts.music.reasoning-effort=none
openai.prompts.music.max-output-tokens=256

openai.prompts.sympathy.model=gpt-6-luna
openai.prompts.sympathy.reasoning-effort=none
openai.prompts.sympathy.max-output-tokens=1024


spring.datasource.url=${DB_LOCAL_URL}
spring.datasource.username=${DB_LOCAL_USERNAME}
spring.datasource.password=${DB_LOCAL_PASSWORD}

aws.s3.bucket=piece-of-cake-image
aws.s3.region=ap-northeast-2

aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}

#??1? ???? create, ? ???? validate
spring.jpa.hibernate.ddl-auto=validate

#? ???? false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


spring.data.redis.host=${REDIS_HOST_NAME}
spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.username=${REDIS_USERNAME}
#spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

firebase.credentials.path=classpath:firebase-service-account.json

# ---- 자체 발급 JWT (스펙 10장) ----
jwt.issuer=${JWT_ISSUER}
# 앱용과 관리자용 서명 키는 서로 다른 32바이트 이상 값이어야 한다. 기동 시 길이를 검사한다.
jwt.member.secret=${JWT_SECRET}
jwt.member.access-token-ttl=${JWT_MEMBER_ACCESS_TTL:30m}
jwt.member.refresh-token-ttl=${JWT_MEMBER_REFRESH_TTL:60d}
jwt.admin.secret=${JWT_ADMIN_SECRET}
jwt.admin.access-token-ttl=${JWT_ADMIN_ACCESS_TTL:2h}

# ---- 소셜 로그인 (스펙 10장) ----
# 쉼표 구분: iOS OAuth 클라이언트 ID, Android 용 server(web) 클라이언트 ID
oauth.google.client-ids=${GOOGLE_CLIENT_IDS:}
# iOS 앱 번들 ID
oauth.apple.client-id=${APPLE_CLIENT_ID:}
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
# .p8 파일 경로 (레포에 커밋 금지)
oauth.apple.private-key-path=${APPLE_PRIVATE_KEY_PATH:}
# 애플 refresh 토큰 암호화 키: base64 32바이트 (`openssl rand -base64 32`). 기본값 없음 — 없으면 기동 실패
oauth.apple.token-encryption-key=${APPLE_TOKEN_ENCRYPTION_KEY}
oauth.apple.base-url=https://appleid.apple.com

# ??? FCM API? ?? ????
app.debug.fcm-enabled=${FCM_DEBUG_ENABLED:false}

# ---- API docs (Swagger / OpenAPI) ----
# Disabled by default. To turn it on for a deployed server, set all three:
#   SWAGGER_ENABLED=true, SWAGGER_USER=<id>, SWAGGER_PASSWORD=<pw>
# If the id/password are missing the docs stay blocked, so a missing env var
# can never expose the API spec by accident.
# Local development overrides these in application-local.properties.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
swagger.auth.enabled=true
swagger.auth.username=${SWAGGER_USER:}
swagger.auth.password=${SWAGGER_PASSWORD:}